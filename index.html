<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>offr — dashboard</title>
<meta name="description" content="Home network launcher">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230A0C10%22/><circle cx=%2250%22 cy=%2250%22 r=%2216%22 fill=%22none%22 stroke=%22%234ADE80%22 stroke-width=%228%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0C10;
    --panel: #12161D;
    --panel-hover: #181D26;
    --border: #232A35;
    --text: #E8EAED;
    --text-dim: #7C8493;
    --accent: #4ADE80;
    --amber: #FFB454;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    overflow-x:hidden;
  }

  button{ font-family:inherit; }

  /* subtle network-mesh backdrop */
  .mesh{
    position:fixed; inset:0; z-index:0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(74,222,128,0.06), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(255,180,84,0.05), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(74,222,128,0.04), transparent 45%);
    pointer-events:none;
  }
  .mesh svg{ position:absolute; inset:0; width:100%; height:100%; opacity:0.35; }

  .wrap{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; flex-direction:column;
    max-width: 980px;
    margin: 0 auto;
    padding: 0 32px;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 36px 4px 8px;
    gap: 16px;
  }

  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .brand .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .header-right{
    display:flex; align-items:center; gap:14px;
  }

  .layout-launch{
    display:flex; align-items:center; gap:6px;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }
  .layout-launch button{
    display:flex; align-items:center; justify-content:center;
    width: 30px; height: 26px;
    border-radius: 7px;
    border:none;
    background: transparent;
    color: var(--text-dim);
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .layout-launch button:hover{ background: var(--panel-hover); color: var(--text); }
  .layout-launch button svg{ width:16px; height:16px; }

  .clock{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .hero{
    padding: 28px 4px 40px;
  }
  .hero h1{
    font-family:'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: clamp(28px, 4vw, 38px);
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .hero h1 span{ color: var(--accent); }

  main{ flex:1; padding-bottom: 60px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
    gap: 22px 18px;
  }

  .tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 10px;
    text-decoration:none;
    color: inherit;
    outline: none;
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
  }

  .icon-box{
    width: 84px; height: 84px;
    border-radius: 20px;
    background: linear-gradient(160deg, var(--panel) 0%, #0D1015 100%);
    border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
  }

  .icon-box svg{ width: 40px; height: 40px; display:block; }
  .icon-box img{ width: 44px; height: 44px; display:block; object-fit:contain; }

  .ext-badge{
    position:absolute; bottom:-4px; right:-4px;
    width:18px; height:18px;
    border-radius:50%;
    background: var(--panel);
    border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim);
  }
  .ext-badge svg{ width:9px; height:9px; }

  .tile:hover .icon-box,
  .tile:focus-visible .icon-box{
    transform: translateY(-3px) scale(1.035);
    border-color: var(--icon-color, var(--accent));
    background: var(--panel-hover);
    box-shadow: 0 10px 28px -12px var(--icon-color, var(--accent));
  }

  .tile:active .icon-box{
    transform: translateY(-1px) scale(0.98);
  }

  .tile-label{
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-dim);
    text-align:center;
    line-height:1.3;
    transition: color 0.16s ease;
  }
  .tile:hover .tile-label,
  .tile:focus-visible .tile-label{ color: var(--text); }

  footer{
    padding: 16px 4px 32px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-dim);
  }

  /* ---------- single-app modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:50;
    background: rgba(6,8,11,0.75);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding: 32px;
  }
  .modal-overlay[hidden]{ display:none; }

  .modal-card{
    width: min(1120px, 100%);
    height: min(760px, 100%);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
    transition: all 0.18s ease;
  }
  .modal-card.expanded{
    width: 100%; height: 100%;
    border-radius: 0;
  }

  .modal-toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: #0D1015;
    flex-shrink:0;
  }
  .modal-title{
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .modal-actions{ display:flex; align-items:center; gap: 4px; }
  .modal-actions button{
    width: 30px; height: 28px;
    display:flex; align-items:center; justify-content:center;
    border:none; border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .modal-actions button:hover{ background: var(--panel-hover); color: var(--text); }
  .modal-actions button svg{ width:15px; height:15px; }
  .modal-actions .close-btn:hover{ color: #F87171; }

  .modal-card iframe{
    flex:1;
    width:100%;
    border:none;
    background:#000;
  }

  /* ---------- split / grid workspace ---------- */
  .workspace-overlay{
    position:fixed; inset:0; z-index:60;
    background: var(--bg);
    display:flex; flex-direction:column;
  }
  .workspace-overlay[hidden]{ display:none; }

  .workspace-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: #0D1015;
    flex-shrink:0;
  }
  .workspace-topbar .layout-switch{
    display:flex; gap:6px;
  }
  .workspace-topbar .layout-switch button{
    display:flex; align-items:center; justify-content:center;
    width:30px; height:28px;
    border-radius:7px;
    border:1px solid var(--border);
    background: var(--panel);
    color: var(--text-dim);
    cursor:pointer;
  }
  .workspace-topbar .layout-switch button.active{
    color: var(--accent);
    border-color: var(--accent);
  }
  .workspace-topbar .layout-switch button svg{ width:15px; height:15px; }

  .workspace-close{
    display:flex; align-items:center; gap:6px;
    border:none; background:transparent;
    color: var(--text-dim);
    font-size:12.5px;
    font-family:'JetBrains Mono', monospace;
    cursor:pointer;
    padding: 6px 10px;
    border-radius:7px;
  }
  .workspace-close:hover{ background: var(--panel-hover); color:#F87171; }

  .workspace-grid{
    flex:1;
    display:grid;
    gap:2px;
    background: var(--border);
    overflow:hidden;
  }

  .slot{
    background: var(--bg);
    display:flex; flex-direction:column;
    min-height:0; min-width:0;
  }

  .slot-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 6px 10px;
    background:#0D1015;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .slot-bar span{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .slot-actions{ display:flex; gap:2px; }
  .slot-actions button{
    width:24px; height:22px;
    display:flex; align-items:center; justify-content:center;
    border:none; border-radius:6px;
    background:transparent;
    color: var(--text-dim);
    cursor:pointer;
  }
  .slot-actions button:hover{ background: var(--panel-hover); color: var(--text); }
  .slot-actions button svg{ width:13px; height:13px; }

  .slot iframe{
    flex:1; width:100%; border:none; background:#000;
  }

  .slot-empty{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 14px;
    padding: 20px;
  }
  .slot-empty-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .slot-picker{
    display:flex; flex-wrap:wrap; gap:10px;
    justify-content:center;
    max-width: 320px;
  }
  .slot-picker button{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    border:1px solid var(--border);
    background: var(--panel);
    border-radius: 12px;
    padding: 10px 12px;
    cursor:pointer;
    color: var(--text-dim);
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .slot-picker button:hover{ color: var(--text); }
  .slot-picker button svg, .slot-picker button img{ width:22px; height:22px; }
  .slot-picker button span{ font-size: 10.5px; }

  @media (prefers-reduced-motion: reduce){
    .icon-box, .modal-card{ transition:none; }
  }

  @media (max-width: 640px){
    .workspace-grid{ grid-template-columns: 1fr !important; grid-template-rows: none !important; }
  }

  @media (max-width: 420px){
    .wrap{ padding:0 18px; }
    .grid{ grid-template-columns: repeat(auto-fill, minmax(96px,1fr)); gap:18px 12px; }
    .icon-box{ width:68px; height:68px; border-radius:16px; }
    .icon-box svg{ width:32px; height:32px; }
    .icon-box img{ width:36px; height:36px; }
    .modal-overlay{ padding:0; }
    .modal-card{ border-radius:0; }
    .header-right{ gap:8px; }
  }
</style>
</head>

    openclaw: `<img src="openclaw.png" alt="OpenClaw">`,
    files: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3.5 7.2c0-1 .8-1.7 1.7-1.7h4l1.8 2h7.3c1 0 1.7.8 1.7 1.7v8.1c0 1-.8 1.7-1.7 1.7H5.2c-1 0-1.7-.8-1.7-1.7V7.2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>`,
    chat: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 12.2c0-4.2 3.6-7.6 8-7.6s8 3.4 8 7.6-3.6 7.6-8 7.6c-1 0-1.9-.15-2.8-.45L5.5 20.5l1-3.5A7.2 7.2 0 0 1 4 12.2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="9" cy="12.2" r="1" fill="currentColor"/>
      <circle cx="12" cy="12.2" r="1" fill="currentColor"/>
      <circle cx="15" cy="12.2" r="1" fill="currentColor"/>
    </svg>`
  };

  function iconMarkup(app){
    return ICONS[app.icon] || '';
  }

  // ---------------- home grid ----------------
  const grid = document.getElementById('grid');
  APPS.forEach((app) => {
    const btn = document.createElement('button');
    btn.className = 'tile';
    btn.style.setProperty('--icon-color', app.color);
    if (app.embeddable === false){
      btn.title = app.name + ' blocks embedding — this will navigate away from the dashboard';
    }
    const badge = app.embeddable === false
      ? `<div class="ext-badge"><svg viewBox="0 0 24 24" fill="none"><path d="M14 4h6v6M20 4L10 14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 13.5V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V7A1.5 1.5 0 0 1 5 5.5h5.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`
      : '';
    btn.innerHTML = `
      <div class="icon-box" style="color:${app.color}">${iconMarkup(app)}${badge}</div>
      <div class="tile-label">${app.name}</div>
    `;
    btn.addEventListener('click', () => {
      if (app.embeddable === false){
        window.location.href = app.url;
      } else {
        openModal(app);
      }
    });
    grid.appendChild(btn);
  });

  document.getElementById('count').textContent = APPS.length + ' service' + (APPS.length === 1 ? '' : 's');

  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent = d.toLocaleTimeString([], {hour12:false});
  }
  tick();
  setInterval(tick, 1000);

  // ---------------- single-app modal ----------------
  const modalOverlay = document.getElementById('modalOverlay');
  const modalCard = document.getElementById('modalCard');
  const modalIframe = document.getElementById('modalIframe');
  const modalTitle = document.getElementById('modalTitle');

  function openModal(app){
    modalTitle.textContent = app.name;
    modalIframe.src = app.url;
    modalCard.classList.remove('expanded');
    modalOverlay.hidden = false;
    document.getElementById('modalOpenExternal').onclick = () => window.open(app.url, '_blank', 'noopener');
  }
  function closeModal(){
    modalOverlay.hidden = true;
    modalIframe.src = 'about:blank';
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalExpand').addEventListener('click', () => modalCard.classList.toggle('expanded'));
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){
      if (!modalOverlay.hidden) closeModal();
      if (!workspaceOverlay.hidden) closeWorkspace();
    }
  });

  // ---------------- split / grid workspace ----------------
  const workspaceOverlay = document.getElementById('workspaceOverlay');
  const workspaceGrid = document.getElementById('workspaceGrid');
  const layoutButtons = document.querySelectorAll('.layout-switch button');

  let workspaceMode = 2;       // 2 or 4
  let slots = [null, null, null, null];

  function openWorkspace(n){
    workspaceMode = n;
    slots = new Array(n).fill(null);
    workspaceOverlay.hidden = false;
    layoutButtons.forEach(b => b.classList.toggle('active', Number(b.dataset.n) === n));
    renderWorkspace();
  }
  function closeWorkspace(){
    workspaceOverlay.hidden = true;
    slots = [null, null, null, null];
  }
  function setWorkspaceMode(n){
    // keep already-open apps where possible when switching layout size
    const kept = slots.filter(Boolean).slice(0, n);
    workspaceMode = n;
    slots = new Array(n).fill(null);
    kept.forEach((app, i) => slots[i] = app);
    layoutButtons.forEach(b => b.classList.toggle('active', Number(b.dataset.n) === n));
    renderWorkspace();
  }

  function renderWorkspace(){
    workspaceGrid.style.gridTemplateColumns = workspaceMode === 2 ? '1fr 1fr' : '1fr 1fr';
    workspaceGrid.style.gridTemplateRows = workspaceMode === 2 ? '1fr' : '1fr 1fr';

    workspaceGrid.innerHTML = '';
    slots.forEach((app, i) => {
      const slot = document.createElement('div');
      slot.className = 'slot';
      if (!app){
        slot.innerHTML = `
          <div class="slot-empty">
            <div class="slot-empty-label">Slot ${i + 1} — choose an app</div>
            <div class="slot-picker"></div>
          </div>`;
        const picker = slot.querySelector('.slot-picker');
        APPS.forEach(a => {
          const b = document.createElement('button');
          const label = a.embeddable === false ? a.name + ' ↗' : a.name;
          b.innerHTML = `${iconMarkup(a)}<span>${label}</span>`;
          b.style.color = a.color;
          if (a.embeddable === false){
            b.title = 'This app blocks embedding — opens here, replacing this page';
            b.addEventListener('click', () => { window.location.href = a.url; });
          } else {
            b.addEventListener('click', () => { slots[i] = a; renderWorkspace(); });
          }
          picker.appendChild(b);
        });
      } else {
        slot.innerHTML = `
          <div class="slot-bar">
            <span>${app.name}</span>
            <div class="slot-actions">
              <button class="ext" title="Open in new tab">
                <svg viewBox="0 0 24 24" fill="none"><path d="M14 4h6v6M20 4L10 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 13.5V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V7A1.5 1.5 0 0 1 5 5.5h5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="clr" title="Clear slot">
                <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>
          <iframe src="${app.url}" referrerpolicy="no-referrer"></iframe>
        `;
        slot.querySelector('.ext').addEventListener('click', () => window.open(app.url, '_blank', 'noopener'));
        slot.querySelector('.clr').addEventListener('click', () => { slots[i] = null; renderWorkspace(); });
      }
      workspaceGrid.appendChild(slot);
    });
  }

  document.getElementById('openSplit').addEventListener('click', () => openWorkspace(2));
  document.getElementById('openQuad').addEventListener('click', () => openWorkspace(4));
  document.getElementById('workspaceClose').addEventListener('click', closeWorkspace);
  layoutButtons.forEach(b => b.addEventListener('click', () => setWorkspaceMode(Number(b.dataset.n))));
</script>

</body>
</html>
