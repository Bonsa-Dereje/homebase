<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offr Inference</title>
<link rel="icon" type="image/png" href="/inference/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<style>
  :root{
    --bg: #ffffff;
    --panel: #ffffff;
    --border: #e5e5e5;
    --border-strong: #d4d4d4;
    --text: #191919;
    --muted: #8a8a8a;
    --muted-strong: #5c5c5c;
    --accent: #191919;
    --user-bubble: #f2f2f2;
    --error: #b3261e;
    --error-bg: #fbeceb;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
            "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", "Consolas", monospace;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  body{
    display:flex; flex-direction:column;
    height:100vh;
  }

  /* Header */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink:0;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand img.mark{
    width: 22px; height: 22px;
    border-radius: 5px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .brand h1{
    font-size: 14.5px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -.1px;
  }
  .brand .status-text{
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 1px;
  }
  .brand .titlewrap{
    display:flex; align-items:center; gap:8px;
  }

  .controls{
    display:flex; align-items:center; gap:8px;
    font-size: 12.5px;
  }
  .controls label{
    color: var(--muted);
    margin-right: 2px;
  }
  .controls input, .controls select{
    background: #ffffff;
    border: 1px solid var(--border-strong);
    color: var(--text);
    border-radius: 7px;
    padding: 6px 10px;
    font-family: var(--font);
    font-size: 12.5px;
    outline: none;
  }
  .controls input:focus, .controls select:focus{
    border-color: #1a1a1a;
  }
  .controls input#endpoint{
    width: 230px;
  }
  .icon-btn{
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--muted-strong);
    border-radius: 7px;
    padding: 6px 12px;
    cursor: pointer;
    font-family: var(--font);
    font-size: 12.5px;
    transition: border-color .15s, color .15s;
  }
  .icon-btn:hover{
    color: var(--text);
    border-color: #1a1a1a;
  }

  /* Chat area */
  main{
    flex: 1;
    overflow-y: auto;
    padding: 32px 0 12px;
  }
  .chat-inner{
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  .empty-state{
    color: var(--muted);
    text-align:center;
    margin-top: 18vh;
    font-size: 14px;
    line-height: 1.6;
  }
  .empty-state .big{
    font-size: 19px;
    color: var(--text);
    margin-bottom: 8px;
    font-weight: 600;
    letter-spacing: -.2px;
  }

  .msg{
    display:flex;
  }
  .msg.user{
    justify-content: flex-end;
  }
  .msg.assistant{
    justify-content: flex-start;
  }
  .bubble{
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble{
    max-width: 78%;
    background: var(--user-bubble);
    padding: 10px 16px;
    border-radius: 16px;
  }
  .msg.assistant .bubble{
    max-width: 100%;
    padding: 0;
    color: var(--text);
  }
  .bubble.error{
    color: var(--error);
    background: var(--error-bg);
    padding: 10px 16px;
    border-radius: 12px;
  }
  .cursor{
    display:inline-block;
    width: 7px; height: 15px;
    background: #1a1a1a;
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* Input area */
  footer{
    background: var(--panel);
    padding: 16px 20px 20px;
    flex-shrink: 0;
  }
  .input-row{
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 6px 6px 6px 20px;
    transition: border-color .15s;
  }
  .input-row:focus-within{
    border-color: #1a1a1a;
  }
  textarea#prompt{
    flex: 1;
    resize: none;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 8px 0;
    font-size: 15px;
    font-family: var(--font);
    line-height: 1.5;
    max-height: 160px;
    outline: none;
  }
  textarea#prompt::placeholder{
    color: var(--muted);
  }
  button#send{
    background: #1a1a1a;
    color: #ffffff;
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity .15s, background .15s;
  }
  button#send svg{
    width: 16px;
    height: 16px;
    stroke: #ffffff;
    fill: none;
  }
  button#send:hover{ opacity: .82; }
  button#send:disabled{
    background: #d4d4d4;
    cursor: not-allowed;
  }
  button#send:disabled svg{ stroke: #ffffff; }

  /* Scrollbar, minimal */
  main::-webkit-scrollbar{ width: 8px; }
  main::-webkit-scrollbar-thumb{ background: #e0e0e0; border-radius: 4px; }
  main::-webkit-scrollbar-track{ background: transparent; }
</style>
</head>
<body>

<header>
  <div class="brand">
    
    <div>
      <h1>Offr Inference</h1>
      <div class="status-text" id="statusText">checking connection…</div>
    </div>
  </div>
  <div class="controls">
    <label for="endpoint">host</label>
    <input id="endpoint" type="text" value="https://offr.tail05ae98.ts.net" spellcheck="false">
    <label for="model">model</label>
    <select id="model">
      <option value="llama3.2:3b">llama3.2:3b</option>
      <option value="mistral:latest">mistral:latest</option>
      <option value="mistral:7b">mistral:7b</option>
      <option value="qwen2.5:1.5b" selected>qwen2.5:1.5b</option>
    </select>
    <button class="icon-btn" id="clearBtn" title="Clear conversation">Clear</button>
  </div>
</header>

<main>
  <div class="chat-inner" id="chatInner">
    <div class="empty-state" id="emptyState">
      <div class="big">Offr Inference</div>
      Running locally over Tailscale. Type below to start.
    </div>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea id="prompt" rows="1" placeholder="Message Offr…"></textarea>
    <button id="send" aria-label="Send message">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5"/>
        <path d="M5 12l7-7 7 7"/>
      </svg>
    </button>
  </div>
</footer>

<script>
(function(){
  const chatInner = document.getElementById('chatInner');
  const emptyState = document.getElementById('emptyState');
  const promptEl = document.getElementById('prompt');
  const sendBtn = document.getElementById('send');
  const endpointEl = document.getElementById('endpoint');
  const modelEl = document.getElementById('model');
  const statusText = document.getElementById('statusText');
  const clearBtn = document.getElementById('clearBtn');

  let history = []; // {role, content}
  let busy = false;

  function normalizeEndpoint(v){
    return v.trim().replace(/\/+$/, '');
  }

  function scrollToBottom(){
    chatInner.parentElement.scrollTop = chatInner.parentElement.scrollHeight;
  }

  function addMessage(role, content){
    if (emptyState) emptyState.remove();
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;
    msg.appendChild(bubble);
    chatInner.appendChild(msg);
    scrollToBottom();
    return bubble;
  }

  function autoGrow(){
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
  }
  promptEl.addEventListener('input', autoGrow);

  promptEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  clearBtn.addEventListener('click', () => {
    history = [];
    chatInner.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'empty-state';
    div.id = 'emptyState';
    div.innerHTML = '<div class="big">Offr Inference</div>Running locally over Tailscale. Type below to start.';
    chatInner.appendChild(div);
  });

  async function checkStatus(){
    const base = normalizeEndpoint(endpointEl.value);
    if (!base){
      statusText.textContent = 'no host set';
      return;
    }
    statusText.textContent = 'checking connection…';
    try{
      const res = await fetch(base + '/api/tags', { method: 'GET' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const names = (data.models || []).map(m => m.name);
      statusText.textContent = names.length ? (names.length + ' model(s) available') : 'connected';
    }catch(err){
      statusText.textContent = 'unreachable — ' + err.message;
    }
  }

  endpointEl.addEventListener('change', checkStatus);
  checkStatus();

  function setBusy(v){
    busy = v;
    sendBtn.disabled = v;
    promptEl.disabled = v;
  }

  async function sendMessage(){
    if (busy) return;
    const text = promptEl.value.trim();
    if (!text) return;

    const base = normalizeEndpoint(endpointEl.value);
    if (!base){
      alert('Set the Ollama host first.');
      return;
    }

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    promptEl.value = '';
    autoGrow();
    setBusy(true);

    const bubble = addMessage('assistant', '');
    bubble.innerHTML = '<span class="cursor"></span>';

    let fullReply = '';

    try{
      const res = await fetch(base + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: modelEl.value,
          messages: history,
          stream: true
        })
      });

      if (!res.ok || !res.body){
        throw new Error('HTTP ' + res.status);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true){
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop(); // keep incomplete line in buffer

        for (const line of lines){
          const trimmed = line.trim();
          if (!trimmed) continue;
          let json;
          try{ json = JSON.parse(trimmed); } catch(e){ continue; }
          if (json.message && json.message.content){
            fullReply += json.message.content;
            bubble.textContent = fullReply;
            bubble.appendChild(Object.assign(document.createElement('span'), { className: 'cursor' }));
            scrollToBottom();
          }
          if (json.done) {
            // stream finished
          }
        }
      }
      // flush remaining buffer
      if (buf.trim()){
        try{
          const json = JSON.parse(buf.trim());
          if (json.message && json.message.content){
            fullReply += json.message.content;
          }
        }catch(e){}
      }

      bubble.textContent = fullReply || '(empty response)';
      history.push({ role: 'assistant', content: fullReply });

    }catch(err){
      bubble.classList.add('error');
      bubble.textContent = 'Error: ' + err.message + '\n\nCheck that the host is reachable and that OLLAMA_ORIGINS allows this page\'s origin.';
      statusText.textContent = 'request failed';
    }finally{
      setBusy(false);
      promptEl.focus();
    }
  }
})();
</script>

</body>
</html>
